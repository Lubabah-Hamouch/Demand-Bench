[project]
name = "demandbench"
version = "0.1.0"
description = "SKU-level demand forecasting on the M5 dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
data = [
    "kaggle>=1.6",
    "python-dotenv>=1.0",
]
modeling = [
    "lightgbm>=4.5",
    "prophet>=1.1.6",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demandbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
